version: 2

project_name: fibery-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: fibery
    binary: fibery
    main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Version metadata lives in the cmd package, not main — see cmd/version.go.
    ldflags:
      - -s -w
      - -X github.com/iamnikolie/fibery-cli/cmd.version={{ .Version }}
      - -X github.com/iamnikolie/fibery-cli/cmd.commit={{ .ShortCommit }}
      - -X github.com/iamnikolie/fibery-cli/cmd.date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request

release:
  draft: false
  prerelease: auto

# Formula in iamnikolie/homebrew-tap, rewritten on every tag. Needs the
# HOMEBREW_TAP_TOKEN secret (fine-grained, contents:write on homebrew-tap only).
brews:
  - name: fibery-cli
    repository:
      owner: iamnikolie
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    commit_author:
      name: Mykola Klitovchenko
      email: mykola.klitovchenko@gmail.com
    commit_msg_template: "{{ .ProjectName }} {{ .Version }}"
    homepage: https://github.com/iamnikolie/fibery-cli
    description: "CLI for Fibery — query, create, comment and attach from a shell"
    license: MIT
    skip_upload: auto
    install: |
      bin.install "fibery"
    test: |
      assert_match(/^fibery /, shell_output("#{bin}/fibery version"))
